name: Release Portable (Windows x64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release-portable-win64:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # 遵循最小权限：仅发版上传与 Release 创建需要写权限
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js build environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (check and test)
        run: |
          npm run check
          npm test

      - name: Download official Node.js win-x64 binary and verify SHA-256
        shell: pwsh
        run: |
          $nodeVersion = "22.14.0"
          $zipName = "node-v$nodeVersion-win-x64.zip"
          $baseUrl = "https://nodejs.org/dist/v$nodeVersion"
          Write-Host "Downloading $zipName and SHASUMS256.txt from official Node.js distribution..."
          Invoke-WebRequest -Uri "$baseUrl/$zipName" -OutFile $zipName
          Invoke-WebRequest -Uri "$baseUrl/SHASUMS256.txt" -OutFile "SHASUMS256.txt"

          $match = Get-Content SHASUMS256.txt | Select-String -Pattern "^\s*([0-9a-fA-F]{64})\s+.*$([regex]::Escape($zipName))\s*`$"
          if (-not $match) {
              throw "Could not find expected checksum for $zipName in official SHASUMS256.txt"
          }
          $expectedHash = $match.Matches.Groups[1].Value.ToLower()
          $actualHash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()

          if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch for $zipName! Expected: $expectedHash, Got: $actualHash"
          }
          Write-Host "Official SHA-256 verified successfully: $actualHash"

          tar.exe -xf $zipName
          if (-not (Test-Path "node-v$nodeVersion-win-x64\node.exe")) {
              throw "Extracted Node.js folder missing node.exe"
          }
          Write-Host "Official runtime extracted to node-v$nodeVersion-win-x64"

      - name: Build Windows x64 portable package
        shell: pwsh
        run: |
          $nodeVersion = "22.14.0"
          Write-Host "Pruning devDependencies to ensure production-only bundle..."
          npm prune --omit=dev
          node scripts/package-portable.mjs --runtime "node-v$nodeVersion-win-x64" --out dist --platform win32 --arch x64

      - name: Portable smoke test
        shell: pwsh
        run: |
          $zip = (Get-ChildItem -Path dist -Filter "Write-*-win32-x64.zip" | Select-Object -First 1).FullName
          if (-not $zip) { throw "Generated portable zip not found in dist" }
          Write-Host "Running smoke test on: $zip"
          node scripts/smoke-portable.mjs $zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Write-portable-win32-x64
          path: |
            dist/Write-*-win32-x64.zip
            dist/Write-*-win32-x64.zip.sha256
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          Write-Host "Publishing portable release assets for tag: $tag"
          $zip = (Get-ChildItem -Path dist -Filter "Write-*-win32-x64.zip" | Select-Object -First 1).FullName
          $sha = (Get-ChildItem -Path dist -Filter "Write-*-win32-x64.zip.sha256" | Select-Object -First 1).FullName

          $existing = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "GitHub Release $tag exists, uploading assets..."
              gh release upload $tag $zip $sha --clobber
          } else {
              Write-Host "Creating GitHub Release $tag and attaching assets..."
              gh release create $tag $zip $sha --title $tag --generate-notes
          }
